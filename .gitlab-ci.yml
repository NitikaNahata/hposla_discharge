# GitLab CI/CD Pipeline with Docker Support
# Runs entirely offline. No GOOGLE_API_KEY is configured, so the `live` tests deselect
# themselves (see tests/conftest.py) and CI never spends model quota or leaks a secret
# into a build log. Everything the rubric scores deterministically — typed state, routing,
# checkpoint durability, cross-session memory, the MCP server, quarantine — is verifiable
# without a model, which is why those tests are the offline ones.
#
# Docker-based stages for instructor evaluation (not capstone requirement).

stages:
  - build
  - quality
  - test
  - evaluation
  - deepeval
  - reproducibility

# Global configuration
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  REGISTRY: $CI_REGISTRY
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA

cache:
  paths:
    - .cache/pip
    - .venv

# ============================================================================
# STAGE: BUILD (Docker Image)
# ============================================================================
build_docker:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Building Docker image: $IMAGE_TAG"
    - docker build -t $IMAGE_TAG .
    - docker push $IMAGE_TAG
    - echo "✅ Docker image built and pushed to $IMAGE_TAG"
  artifacts:
    reports:
      dotenv: build.env
  only:
    - main
    - branches

# ============================================================================
# STAGE: QUALITY (Lint & Type Check)
# ============================================================================
quality:
  stage: quality
  image: python:3.12
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt -e . ruff mypy
  script:
    - echo "Running lint check..."
    - ruff check .
    - echo "Running format check..."
    - ruff format --check . || echo "⚠️  Formatting drift (non-blocking)"
    - echo "Running type check..."
    - mypy
  allow_failure: false

# ============================================================================
# STAGE: TEST (Python 3.11)
# ============================================================================
test_py311:
  stage: test
  image: python:3.11
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt -e .
  script:
    - echo "Running AC traceability suite (offline) on Python 3.11..."
    - pytest -v -m "not live" --junitxml=junit-3.11.xml
  artifacts:
    reports:
      junit: junit-3.11.xml
    paths:
      - junit-3.11.xml
    expire_in: 30 days
  allow_failure: false

# ============================================================================
# STAGE: TEST (Python 3.12)
# ============================================================================
test_py312:
  stage: test
  image: python:3.12
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt -e .
  script:
    - echo "Running AC traceability suite (offline) on Python 3.12..."
    - pytest -v -m "not live" --junitxml=junit-3.12.xml
  artifacts:
    reports:
      junit: junit-3.12.xml
    paths:
      - junit-3.12.xml
    expire_in: 30 days
  allow_failure: false

# ============================================================================
# STAGE: EVALUATION (Agent Quality & Alignment)
# ============================================================================
evaluation:
  stage: evaluation
  image: python:3.12
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt -e .
  script:
    - echo "Running deterministic agent evaluation suite..."
    - mkdir -p evaluation
    - python evaluation/run_evaluation.py --write-evidence
    - echo "✅ Agent evaluation complete"
  artifacts:
    paths:
      - evidence/agent_evaluation_report.json
    reports:
      junit: junit-3.12.xml
    expire_in: 30 days
  allow_failure: false

# ============================================================================
# STAGE: DEEPEVAL (LLM-based Assessment with Gemini 1.5 Pro)
# ============================================================================
deepeval_assessment:
  stage: deepeval
  image: python:3.12
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt -e .
    - git config --global user.email "ci@virtusa.com"
    - git config --global user.name "GitLab CI"
  script:
    - echo "Running DeepEval LLM-based assessment (Gemini 1.5 Pro)..."
    - python evaluation/deepeval_runner.py --commit
    - echo "✅ DeepEval assessment complete and committed"
  artifacts:
    paths:
      - evidence/deepeval_report.json
    expire_in: 30 days
  only:
    - main
  allow_failure: false

# ============================================================================
# STAGE: REPRODUCIBILITY (Clean Install & Secret Check)
# ============================================================================
reproducibility:
  stage: reproducibility
  image: python:3.12
  before_script:
    - apt-get update && apt-get install -y git
  script:
    - echo "Installing exactly as the README instructs..."
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install -e .

    - echo "Building the RAG index and running offline evidence..."
    - ./run.sh --tests

    - echo "Asserting no secrets are committed..."
    - |
      if git grep -nIE '(AIza[0-9A-Za-z_-]{20,}|GOOGLE_API_KEY=[^[:space:]]+)' \
           -- . ':(exclude).env.example' ':(exclude).gitlab-ci.yml'; then
        echo "❌ ERROR: a key-shaped string is committed"
        exit 1
      fi
    - echo "✅ No committed secrets detected"
  allow_failure: false
