# Optional but recommended:  pip install pre-commit && pre-commit install
#
# Mirrors the CI quality job so drift is caught before it is pushed rather than after.
# Kept to fast, local, offline hooks — nothing here needs an API key or network.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
        # Sample cases carry a leading "_comment" key; plain JSON, still valid.
        files: \.json$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: no-committed-api-keys
        name: no committed API keys (NFR-01)
        entry: >
          bash -c 'git diff --cached -U0 |
          grep -nE "^\+.*(AIza[0-9A-Za-z_-]{20,}|GOOGLE_API_KEY=[^[:space:]]+)" &&
          { echo "refusing: key-shaped string in staged diff"; exit 1; } || exit 0'
        language: system
        pass_filenames: false
