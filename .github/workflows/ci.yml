name: CI

# GitHub Actions mirror of .gitlab-ci.yml. Runs entirely offline by default — no
# GOOGLE_API_KEY is required, so the `live`-marked tests deselect themselves (see
# tests/conftest.py) and the quality/test/evaluation/reproducibility jobs never spend
# model quota or need a secret. Only the deepeval job talks to Gemini, and only on
# pushes to main, and only if the GOOGLE_API_KEY secret is configured.
#
# Nothing in this workflow pushes to main — evaluation/deepeval_runner.py's --commit
# flag only commits inside the ephemeral runner checkout, which is discarded when the
# job ends. All real changes to main go through PR merges, never a CI push.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t discharge-copilot:${{ github.sha }} .

  quality:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -e . ruff mypy
      - run: ruff check .
      - run: ruff format --check . || echo "⚠️  Formatting drift (non-blocking)"
      - run: mypy

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -e .
      - run: pytest -v -m "not live" --junitxml=junit-${{ matrix.python-version }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-py${{ matrix.python-version }}
          path: junit-${{ matrix.python-version }}.xml

  evaluation:
    name: Deterministic agent evaluation
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -e .
      - run: python evaluation/run_evaluation.py --write-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: agent-evaluation-report
          path: evidence/agent_evaluation_report.json

  deepeval:
    name: DeepEval LLM assessment (Gemini)
    runs-on: ubuntu-latest
    needs: [evaluation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -e .
      - name: Run DeepEval assessment
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "⚠️  GOOGLE_API_KEY secret not configured — skipping DeepEval assessment"
            exit 0
          fi
          git config user.email "ci@discharge-copilot.local"
          git config user.name "GitHub Actions"
          python evaluation/deepeval_runner.py --commit
      - uses: actions/upload-artifact@v4
        with:
          name: deepeval-report
          path: evidence/deepeval_report.json
          if-no-files-found: ignore

  reproducibility:
    name: Reproducibility & secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - name: Run offline test suite via the documented entry point
        run: ./run.sh --tests
      - name: Assert no secrets are committed
        run: |
          # Only the AIza... shape is checked - a real Google API key. A looser
          # GOOGLE_API_KEY=<anything> pattern false-positives on every legitimate
          # reference to the env var name (docker-compose.yml, docs, tests, run.sh's
          # own presence check) since it doesn't care what follows the "=".
          if git grep -nIE 'AIza[0-9A-Za-z_-]{20,}' \
               -- . ':(exclude).env.example' ':(exclude).gitlab-ci.yml' \
                  ':(exclude).github/workflows/*' ':(exclude).pre-commit-config.yaml'; then
            echo "❌ ERROR: a key-shaped string is committed"
            exit 1
          fi
          echo "✅ No committed secrets detected"
